plugins {
    id 'com.android.application'
}

android {
    namespace 'com.directormonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.flyermaker"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
